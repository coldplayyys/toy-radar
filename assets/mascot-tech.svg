<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="潮玩雷达科技版小奶龙图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#101C33"/>
      <stop offset="1" stop-color="#18233D"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9E8"/>
      <stop offset="1" stop-color="#FFE6B4"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- 科技底板 -->
  <rect x="3" y="3" width="114" height="114" rx="28" fill="url(#bg)"
        stroke="#67E8F9" stroke-opacity="0.28" stroke-width="1.5"/>
  <g stroke="#67E8F9" stroke-opacity="0.07" stroke-width="1">
    <path d="M20 8V112M40 8V112M60 8V112M80 8V112M100 8V112"/>
    <path d="M8 20H112M8 40H112M8 60H112M8 80H112M8 100H112"/>
  </g>

  <!-- 雷达波纹 -->
  <g fill="none" stroke-linecap="round">
    <circle cx="60" cy="62" r="34" stroke="#67E8F9" stroke-opacity="0.22" stroke-dasharray="2 6"/>
    <circle cx="60" cy="62" r="47" stroke="#F472B6" stroke-opacity="0.16" stroke-dasharray="2 8"/>
  </g>

  <!-- 扫描扇面（缓慢旋转） -->
  <g>
    <path d="M60 62 L60 20 A42 42 0 0 1 91 34 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 60 62" to="360 60 62" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 电路走线 -->
  <g stroke="#67E8F9" stroke-opacity="0.5" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M33 80h-9v9h-6"/>
    <path d="M87 80h9v-8h6"/>
    <path d="M34 47h-9v-8h-6"/>
    <path d="M86 47h9v-8h6"/>
  </g>
  <g fill="#F472B6">
    <circle cx="18" cy="89" r="2"/>
    <circle cx="102" cy="72" r="2"/>
    <circle cx="19" cy="39" r="2"/>
    <circle cx="101" cy="39" r="2"/>
  </g>

  <!-- 小奶龙 -->
  <path d="M47 47c-2-9 1-14 5-14s7 5 5 14" fill="#FFE6A8" stroke="#E0B95F" stroke-width="2"/>
  <path d="M63 47c-2-9 1-14 5-14s7 5 5 14" fill="#FFE6A8" stroke="#E0B95F" stroke-width="2"/>
  <ellipse cx="60" cy="64" rx="23" ry="21" fill="url(#head)" stroke="#E7C783" stroke-width="2.5"/>

  <!-- 发光眼睛 -->
  <circle cx="51" cy="63" r="6" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="69" cy="63" r="6" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="51" cy="63" rx="3.6" ry="4.6" fill="#0B1220"/>
  <ellipse cx="69" cy="63" rx="3.6" ry="4.6" fill="#0B1220"/>
  <circle cx="52" cy="61.5" r="1.5" fill="#67E8F9"/>
  <circle cx="70" cy="61.5" r="1.5" fill="#67E8F9"/>

  <!-- 腮红与笑 -->
  <ellipse cx="43" cy="71" rx="5" ry="3" fill="#F472B6" opacity="0.32"/>
  <ellipse cx="77" cy="71" rx="5" ry="3" fill="#F472B6" opacity="0.32"/>
  <path d="M56 72c1.6 2 6.4 2 8 0" fill="none" stroke="#4A3440" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 顶部信号点 -->
  <circle cx="60" cy="24" r="3" fill="#67E8F9"/>
  <circle cx="60" cy="24" r="7" fill="url(#glow)" filter="url(#soft)"/>
</svg>
